name: Tests

on: [workflow_dispatch]

permissions: {}
jobs:
  runPush:
    permissions:
      contents: write # for Update bundles

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Trigger BE build
      if: ${{ github.repository == 'rally-4/Mindustryan' }}
      run: |
        git clone --depth=1 --branch=master https://github.com/rally-4/MindustryanBuilds ../MindustryanBuilds
        cd ../MindustryanBuilds
        BNUM=$(($GITHUB_RUN_NUMBER + 20000))
        git tag ${BNUM}
        git config --global user.name "Github Actions"
        git push https://rally-4:${{ secrets.API_TOKEN_GITHUB }}@github.com/rally-4/MindustryanBuilds ${BNUM}
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 17
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
    - name: Update bundles
      if: ${{ github.repository == 'rally-4/Mindustryan' }}
      run: |
        ./gradlew -DcompileMethodParams updateBundles

        if [ -n "$(git status --porcelain)" ]; then
          git config --global user.name "Github Actions"
          git config --global user.email "actions@github.com"
          git add core/assets/bundles/*
          git commit -m "Automatic bundle update"
          git push
        fi
    - name: Update scripts, class mappings and map names
      if: ${{ github.repository == 'rally-4/Mindustryan' }}
      run: |
        ./gradlew -DcompileMethodParams updateScripts fixMaps

        if [ -n "$(git status --porcelain)" ]; then
          git config --global user.name "Github Actions"
          git config --global user.email "actions@github.com"
          git add core/assets/scripts/* core/src/mindustry/mod/ClassMap.java
          git add core/assets/maps/*
          git commit -m "Automatic class mapping and map name update"
          git push
        fi
    - name: Install client test dependencies
      run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
    - name: Run client tests
      run: ./gradlew pack tests:testAll
